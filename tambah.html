<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TauKas - Tambah Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-4" href="index.html">TauKas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard / Mutasi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="tambah.html">Tambah Transaksi</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white gap-3">
                    <span class="small">Halo, <strong>Admin Kas</strong></span>
                    <a href="login.html" class="btn btn-outline-light btn-sm">Keluar</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 720px;">
        <div class="card border-0 shadow-sm rounded-3 p-4">
            <h4 class="fw-bold text-dark mb-3">Tambah Transaksi Kas Baru</h4>
            <hr>

            <form action="index.html" method="POST">
                <div class="mb-3">
                    <label for="nama_bank" class="form-label fw-semibold">Nama Bank / Akun Kas</label>
                    <select class="form-select" id="nama_bank" required>
                        <option value="">-- Pilih Bank --</option>
                        <option value="bca">BCA</option>
                        <option value="mandiri">Mandiri</option>
                        <option value="kas_tunai">Kas Tunai</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Jenis Transaksi</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jenis_transaksi" id="pemasukan" value="pemasukan" checked>
                        <label class="form-check-label text-success fw-bold" for="pemasukan">Kas Masuk (Pemasukan)</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jenis_transaksi" id="pengeluaran" value="pengeluaran">
                        <label class="form-check-label text-danger fw-bold" for="pengeluaran">Kas Keluar (Pengeluaran)</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="tanggal_transaksi" class="form-label fw-semibold">Tanggal Transaksi</label>
                    <input type="date" class="form-control" id="tanggal_transaksi" required>
                </div>

                <div class="mb-3">
                    <label for="nominal" class="form-label fw-semibold">Nominal (Rp)</label>
                    <input type="number" class="form-control" id="nominal" placeholder="Contoh: 1500000" required>
                </div>

                <div class="mb-4">
                    <label for="keterangan" class="form-label fw-semibold">Keterangan / Deskripsi</label>
                    <textarea class="form-control" id="keterangan" rows="4" placeholder="Masukkan deskripsi transaksi..." required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Simpan Transaksi</button>
                    <a href="index.html" class="btn btn-outline-secondary">Batal</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white text-center py-3 border-top mt-5">
        <p class="text-muted small mb-0">&copy; 2026 Aplikasi TauKas</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
