<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TauKas - Tambah Transaksi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">TauKas</div>
        <nav>
            <ul>
                <li><a href="index.html">Laporan Mutasi Kas</a></li>
                <li><a href="tambah.html" class="active">Tambah Transaksi</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="card">
            <h2>Tambah Transaksi Kas Baru</h2>
            <br>
            <form action="index.html" method="POST">
                
                <div class="form-group">
                    <label for="nama_bank">Nama Bank / Akun Kas:</label>
                    <select id="nama_bank" name="nama_bank" required>
                        <option value="">-- Pilih Bank --</option>
                        <option value="bca">BCA</option>
                        <option value="mandiri">Mandiri</option>
                        <option value="kas_tunai">Kas Tunai</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Jenis Transaksi:</label>
                    <div class="radio-group">
                        <label for="pemasukan" class="radio-option">
                            <input type="radio" id="pemasukan" name="jenis_transaksi" value="pemasukan" checked> 
                            <img src="assets/pemasukan.png" alt="Kas Masuk" class="icon-kategori"> 
                            Kas Masuk (Pemasukan)
                        </label>

                        <label for="pengeluaran" class="radio-option">
                            <input type="radio" id="pengeluaran" name="jenis_transaksi" value="pengeluaran">
                            <img src="assets/pengeluaran.png" alt="Kas Keluar" class="icon-kategori"> 
                            Kas Keluar (Pengeluaran)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tanggal_transaksi">Tanggal Transaksi:</label>
                    <input type="date" id="tanggal_transaksi" name="tanggal_transaksi" required>
                </div>

                <div class="form-group">
                    <label for="nominal">Nominal (Rp):</label>
                    <input type="number" id="nominal" name="nominal" placeholder="Contoh: 1500000" required>
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan / Deskripsi:</label>
                    <textarea id="keterangan" name="keterangan" rows="4" placeholder="Masukkan deskripsi transaksi..." required></textarea>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn-primary">Simpan Transaksi</button>
                    <a href="index.html" style="margin-left: 10px; color: #64748b; text-decoration: none;">Batal</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Aplikasi TauKas</p>
    </footer>

</body>
</html>
